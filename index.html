<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NeuroScan AI - Project Entry</title>
    <!-- Redirect to Streamlit Cloud -->
    <meta http-equiv="refresh" content="3;url=https://neuroscan-ai-tech.streamlit.app/" />
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0;
            background-color: #0e1117; 
            color: #fafafa; 
            flex-direction: column; 
        }
        .container { 
            text-align: center; 
            padding: 40px; 
            background: #262730; 
            border-radius: 12px; 
            box-shadow: 0 8px 24px rgba(0,0,0,0.5); 
            max-width: 500px;
        }
        h1 { 
            margin-top: 0;
            color: #ff4b4b; 
        }
        p { 
            margin-bottom: 24px; 
            line-height: 1.5;
        }
        .button { 
            display: inline-block; 
            padding: 12px 24px; 
            color: white; 
            background: #ff4b4b; 
            text-decoration: none; 
            border-radius: 6px; 
            font-weight: bold;
            transition: background 0.3s;
        }
        .button:hover { 
            background: #ff6b6b; 
        }
        .loader {
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-top: 4px solid #ff4b4b;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🧠 NeuroScan AI</h1>
        <p>Connecting to the live application on Streamlit Cloud...</p>
        <div class="loader"></div>
        <p style="font-size: 0.9em; color: #b2b2b2;">
            If you are not redirected automatically in a few seconds, click the button below.
        </p>
        <a href="https://neuroscan-ai-tech.streamlit.app/" class="button">Open NeuroScan AI</a>
    </div>
</body>
</html>
